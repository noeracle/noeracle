[package]
name = "noeracle_bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "arithmetic"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "arithmetic"] }
rand = { version = "0.8" }
sha2 = { version = "0.10", default-features = false }

[features]
testutils = ["soroban-sdk/testutils"]
